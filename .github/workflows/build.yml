name: EXPERIMENT - macOS 10.13 + Xcode 10 (probably will just hang)

# Цель: чисто экспериментально проверить, существует ли ещё в пуле
# GitHub-hosted раннеров образ с macOS 10.13 (High Sierra) и Xcode 10.
# Ожидаемый результат: джоб зависнет в статусе "Waiting for a runner to
# pick up this job" и в итоге будет отменён по таймауту, потому что
# GitHub официально снял образы macos-10.13/macos-10.14 с производства
# много лет назад. Если это всё же сработает — будет неожиданностью,
# и тогда лог ниже покажет, что реально стоит на машине.

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: macos-10.13
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show OS and Xcode versions if we actually got a runner
        run: |
          echo "=== sw_vers ==="
          sw_vers || true
          echo "=== available Xcode installs ==="
          ls -la /Applications | grep -i xcode || echo "нет ни одной Xcode.app в /Applications"
          echo "=== xcodebuild -version (default) ==="
          xcodebuild -version || true
          echo "=== xcode-select -p ==="
          xcode-select -p || true            echo "::error::NSFaceIDUsageDescription отсутствует в собранном Info.plist — код-пароль с Face ID будет крашить приложение на реальном устройстве"
            exit 1
          fi
          echo "OK: NSFaceIDUsageDescription присутствует в собранном Info.plist"

      - name: Upload full build log (always, for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          retention-days: 7

      - name: Package .ipa (unsigned)
        run: |
          mkdir -p build/Payload
          cp -R "build/ITDOApp.xcarchive/Products/Applications/ITDOApp.app" build/Payload/
          cd build
          zip -r ITDOApp-unsigned.ipa Payload
          cd ..

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ITDOApp-unsigned-ipa
          path: build/ITDOApp-unsigned.ipa
          retention-days: 30
